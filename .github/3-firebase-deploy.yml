name: "Faza 3: Firebase Deployment"

on:
  push:
    branches:
      - main

jobs:
  deploy_to_firebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # DODANY KROK: Ostatnia weryfikacja testów bezpośrednio przed deploymentem
      - name: Run Unit Tests
        run: npm test

      - name: Build Project
        run: npm run build

      # Deployment odpali się tylko wtedy, gdy powyższy krok 'npm test' przejdzie pomyślnie
      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@v13.4.0
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
