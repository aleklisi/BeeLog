name: "Faza 2: QA & Gemini Auto-Fix"

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  test_pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # KLUCZOWY KROK: Uruchomienie Twoich testów w Pull Requeście
      - name: Run Unit Tests
        id: run_tests
        run: npm test
        continue-on-error: true

      - name: Gemini Auto-Fix on Failure
        if: steps.run_tests.outcome == 'failure'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "gemini-bot"
          git config --global user.email "gemini-bot@github.com"
          
          npm install -g @google/gemini-cli
          
          gemini -p "Komenda 'npm test' zakończyła się błędem. Przeanalizuj pliki projektu oraz kod testów, znajdź usterkę i napraw ją, aby testy przechodziły pomyślnie." --auto-edit
          
          git add .
          git commit -m "fix: auto-repaired failing tests by Gemini"
          git push origin ${{ github.head_ref }}
          
          exit 1
