name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ["coverage/coverage-badge.json"]
  pull_request:
    branches: [main, master]
  workflow_call:

permissions:
  contents: write

jobs:
  openspec:
    uses: ./.github/workflows/openspec.yml
  elm-tests:
    uses: ./.github/workflows/elm-tests.yml
  build:
    needs: [openspec, elm-tests]
    uses: ./.github/workflows/build.yml
  e2e:
    needs: build
    uses: ./.github/workflows/e2e.yml
  coverage:
    needs: [openspec, elm-tests]
    uses: ./.github/workflows/coverage.yml
  publish-coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-badge
          path: coverage
      - name: Update coverage badge data
        run: |
          mkdir -p coverage
          git add coverage/coverage-badge.json
          if git diff --cached --quiet; then
            echo "Coverage badge has not changed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update test coverage badge"
            git push
          fi
