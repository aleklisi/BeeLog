name: Elm Tests CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Elm
        uses: jcollion/setup-elm@v4
        with:
          elm-version: '0.19.1'

      - name: Install Node dependencies
        run: npm install

      - name: Install elm-test
        run: npm install -g elm-test

      - name: Run Elm Tests via Makefile
        run: make elm_test
